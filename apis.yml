apis:
- name: Secoda API
  description: >-
    HTTP REST API to interact with a Secoda workspace — CRUD over catalog
    resources (databases, schemas, tables, columns, dashboards, charts,
    collections, documents, glossary/terms, tags, custom properties), plus users,
    teams, groups, monitors, queries, questions, lineage, events, and audit logs.
    Bearer API-key auth; 30 calls/min write rate limit; page-based pagination.
  humanURL: https://docs.secoda.co/api
  baseURL: https://api.secoda.co
