aid: secoda
name: Secoda
description: >-
  Secoda is an AI-powered data catalog, governance, and observability platform
  that acts as a metadata control plane for data teams. It unifies discovery,
  documentation, lineage, data-quality monitoring, and access governance across
  70+ integrations (Snowflake, BigQuery, Databricks, dbt, Tableau, and more),
  and exposes a REST API plus a Model Context Protocol (MCP) server so agents and
  automation can search assets, run SQL, retrieve lineage, and manage users,
  tags, and metadata programmatically. Backed by Craft Ventures.
